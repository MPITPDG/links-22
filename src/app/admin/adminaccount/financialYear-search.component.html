<div class="im-page">
  <div class="ph">
    <div>
      <h1>Financial Year Search</h1>
      <p>Find companies by financial year date range</p>
    </div>
  </div>

  <div class="card">
    <div class="filters">
      <div class="f">
        <label>Start Date <span class="req">*</span></label>
        <my-date-picker name="StartDate" [options]="myDatePickerOptions" [(ngModel)]="StartDate"></my-date-picker>
      </div>
      <div class="f">
        <label>End Date <span class="req">*</span></label>
        <my-date-picker name="EndDate" [options]="myDatePickerOptions" [(ngModel)]="EndDate"></my-date-picker>
      </div>
      <div class="f">
        <button class="btn p" type="submit" (click)="searchlist()">Search</button>
      </div>
    </div>

    <div class="toolbar">
      <span class="count">{{ branchlist?.length || 0 }} {{ branchlist?.length === 1 ? 'company' : 'companies' }}</span>
    </div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th>Company Name</th>
          </tr>
        </thead>
        <tbody>
          @for (obj of branchlist; track obj) {
            <tr>
              <td>{{obj.CMP_NAME}}</td>
            </tr>
          } @empty {
            <tr><td class="empty">No companies to show. Pick a date range and search.</td></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
