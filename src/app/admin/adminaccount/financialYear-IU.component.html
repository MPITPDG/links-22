<div class="im-page">
  <div class="ph">
    <div>
      <h1>{{Header| uppercase}}</h1>
      <p>Financial year master</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>Financial Year Details</h2></div>
    <div class="fields">
      <div class="fld">
        <label>City <span class="req">*</span></label>
        <select class="form-control" [(ngModel)]="city" (change)="selectionChange($event.target.value)">
          <option value="">Please select</option>
          @for (d of Citylist; track d) {
            <option value={{d.CITYCODE}}>{{d.CITYNAME}}</option>
          }
        </select>
      </div>
      <div class="fld full">
        <label>Company <span class="req">*</span></label>
        <select class="form-control" [(ngModel)]="company">
          <option value="">Please select</option>
          @for (d of CompanyList; track d) {
            <option value={{d.CMP_CODE}}>{{d.CMP_NAME}}</option>
          }
        </select>
      </div>
      <div class="fld">
        <label>Start Date <span class="req">*</span></label>
        <my-date-picker name="StartDate" [options]="myDatePickerOptions" [(ngModel)]="StartDate"></my-date-picker>
      </div>
      <div class="fld">
        <label>End Date <span class="req">*</span></label>
        <my-date-picker name="EndDate" [options]="myDatePickerOptions" [(ngModel)]="EndDate"></my-date-picker>
      </div>
    </div>
  </div>

  <div class="bar">
    <span class="note">Nothing is saved until you choose {{text}}.</span>
    <div class="r">
      <button class="btn g" type="reset" (click)="RestMain();">Reset</button>
      <button class="btn p" type="submit" (click)="AddMain()">{{text}}</button>
    </div>
  </div>
</div>
