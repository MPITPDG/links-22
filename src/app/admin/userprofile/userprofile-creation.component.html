<div class="im-page">
  <div class="ph">
    <div>
      <h1>{{Header| uppercase}}</h1>
      <p>Create or update an application user</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>User Details</h2></div>
    <div class="fields">
      <div class="fld full">
        <label>User Name <span class="req">*</span></label>
        <input [(ngModel)]="username" type="text" class="form-control" maxlength="40">
      </div>
      <div class="fld full ad-pw">
        <label>Password <span class="req">*</span></label>
        <div>
          <input [(ngModel)]="password" type="password" class="form-control" maxlength="20" placeholder="New Password" (keydown)="onKeydown($event.target.value)" required pattern="a-zA-Z0–9">
          <div class="hint">
            <span id="8char"><i class="fa fa-check"></i>8 Characters Long</span>
            <span id="ucase"><i class="fa fa-check"></i>1 Uppercase Letter</span>
            <span id="lcase"><i class="fa fa-check"></i>1 Lowercase Letter</span>
            <span id="1num"><i class="fa fa-check"></i>1 Number</span>
          </div>
        </div>
      </div>
      <div class="fld">
        <label>Full Name <span class="req">*</span></label>
        <input [(ngModel)]="fullname" type="text" class="form-control">
      </div>
      <div class="fld">
        <label>Greeting <span class="req">*</span></label>
        <input [(ngModel)]="greeting" type="text" class="form-control" maxlength="40">
      </div>
      <div class="fld full">
        <label>E-Mail</label>
        <input [(ngModel)]="email" type="text" class="form-control" (change)="onChange(email)">
      </div>
      <div class="fld full">
        <label>List Branch <span class="req">*</span></label>
        <ng-select [items]="Branchlist" class="form-control"
          bindLabel="CITYNAME"
          bindValue="CITYCODE"
          appendTo="body"
          multiple="true" [closeOnSelect]="false"
          [selectableGroup]="true"
          [(ngModel)]="branchcode"
          (change)="onchnage(branchcode)">
          <ng-template ng-option-tmp let-item="item" let-item$="item$" let-index="index">
            <input type="checkbox" [(ngModel)]="item$.selected" />
            {{ item.CITYNAME}}
          </ng-template>
        </ng-select>
      </div>
      <div class="fld">
        <label>Location <span class="req">*</span></label>
        <select [(ngModel)]="location" class="form-control">
          @for (ct of Locationlist; track ct) {
            <option value={{ct.LOCATION}}>{{ct.LOCATION}}</option>
          }
        </select>
      </div>
      <div class="fld">
        <label>Image Name <span class="req">*</span></label>
        <input #fileUpload type="file" accept=".png, .jpg, .jpeg" (change)="onFileChanged($event)" class="form-control">
      </div>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>Access &amp; Unblock</h2></div>
    <div class="fields">
      <div class="fld">
        <label>Date Limit <span class="req">*</span></label>
        <my-date-picker name="datelimit" [options]="myDatePickerOptions" [(ngModel)]="datelimit"></my-date-picker>
      </div>
      <div class="fld">
        <label>No of Days</label>
        <input [(ngModel)]="noofdays" pattern="^[0-9]+$" type="text" class="form-control" maxlength="40">
      </div>
      <div class="fld">
        <label>Equivalent to Admin</label>
        <input type="checkbox" [(ngModel)]="equadmin">
      </div>
      <div class="fld">
        <label>Is Resigned</label>
        <input type="checkbox" [(ngModel)]="isresigned">
      </div>
      <div class="fld">
        <label>Unblock User</label>
        <input type="checkbox" [(ngModel)]="unblock">
      </div>
      <div class="fld" aria-hidden="true"></div>
    </div>
  </div>

  <div class="bar">
    <span class="note">Nothing is saved until you choose {{text}}.</span>
    <div class="r">
      <button class="btn g" type="reset" (click)="RestMain();">Reset</button>
      <button class="btn p" type="submit" (click)="Add_Profile()">{{text}}</button>
    </div>
  </div>
</div>
