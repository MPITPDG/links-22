<div class="animated fadeIn">
	<div class="row">
		<div class="col-sm-5">
		</div>
		<div class="col-sm-2">
			@if (countries.length==0) {
<img src="assets/img/loading.gif"/>
}
			@if (countries.length > 0) {
<div class="card">
				<div class="card-body">
					@for (obj of countries; track obj) {
<button type="button" class="btn btn-outline-primary btn-block" [ngStyle]="{'margin-top':'0rem'}" (click)="setCity(obj.CITYCODE);">
						<u>{{ obj.CITYNAME | titlecase }}</u>
					</button>
}
				</div>
			</div>
}
		</div>
		<div class="col-sm-5">
		</div>
	</div>
</div>
