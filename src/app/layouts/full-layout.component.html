<!--
  Application shell (ported from MPERPNG-20).

  Full-width header on top, sidebar beneath it. The company name lives in the
  header where it has room - in the 16rem rail it truncated - and the rail
  carries the module name instead.

  Used by every top-level route, accounts included (the old
  FullLayoutComponent_acc copy is gone). There is one shell: change it here and
  it changes everywhere.
-->
<div class="theme-gray flex h-screen w-full flex-col overflow-hidden bg-[var(--background)]"
     style="--sidebar-width: 16rem; --sidebar-width-icon: 3.25rem;">

  <!-- ── header: spans the full width ───────────────────────────────────── -->
  <header class="z-30 flex h-14 shrink-0 items-center gap-3 border-b border-[var(--sidebar-border)]
                 bg-[var(--sidebar)] px-3 sm:px-4">

    <button type="button" (click)="sidebar.toggleSidebar()"
            uiBtn variant="ghost" size="icon-sm"
            title="Toggle sidebar (Ctrl+B)"
            [attr.aria-label]="sidebar.state() === 'collapsed' ? 'Expand sidebar' : 'Collapse sidebar'"
            class="-ms-1 !text-white/80 hover:!bg-white/10 hover:!text-[var(--sidebar-accent-foreground)]">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="h-4 w-4">
        <rect x="3" y="3" width="18" height="18" rx="2" /><path d="M9 3v18" />
      </svg>
    </button>

    <!-- Links logo is a wide wordmark, so the white tile keeps MP's height and
         radius but sizes its width to the mark instead of a fixed square. Company 32 shows
         only its OLSPL ribbon emblem, without a tile; its name is the text beside it. -->
    <img [src]="cmplogo" [alt]="olspl ? 'OLSPL' : 'Links'"
         class="w-auto shrink-0 object-contain"
         [ngClass]="olspl ? 'h-9 max-w-[5.5rem]' : 'h-8 max-w-[4.5rem] rounded-lg bg-white/95 p-1'"
         onerror="this.style.display='none'" />

    <span class="truncate text-sm font-semibold text-[var(--sidebar-accent-foreground)] sm:text-base">
      {{ cmpname | titlecase }}
    </span>

    <div class="ml-auto flex items-center gap-2">
      @if (showFinancialYear) {
        <div class="hidden md:block"><app-financial-year></app-financial-year></div>
      }

      <!-- Missed-toast recovery: every toast is also recorded here. -->
      <app-notification-bell></app-notification-bell>

      @if (cityName) {
        <a [routerLink]="['/branch']" uiBtn variant="ghost" size="sm"
           [title]="'Change branch - currently ' + cityName"
           class="border border-white/20 !text-[var(--sidebar-accent-foreground)] hover:!bg-white/10 hover:border-white/30">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="h-3.5 w-3.5">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" />
          </svg>
          <span class="font-medium uppercase tracking-wide">{{ cityName }}</span>
        </a>
      }

      <!-- Red on purpose: leaving for the module picker abandons whatever is
           open on the current screen, so it should not read as incidental. -->
      <button type="button" (click)="goto('HOME')" uiBtn variant="destructive" size="sm"
              title="Switch module">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="h-4 w-4">
          <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z" />
        </svg>
        <span class="hidden sm:inline">Modules</span>
      </button>
    </div>
  </header>

  <!-- ── body: sidebar + content, beneath the header ────────────────────── -->
  <div class="flex min-h-0 flex-1">

    @if (sidebar.isMobile() && sidebar.openMobile()) {
      <div class="fixed inset-0 top-14 z-40 bg-black/60" (click)="sidebar.setOpenMobile(false)" aria-hidden="true"></div>
    }

    <div class="z-40 shrink-0 transition-[width,transform] duration-200 ease-linear
                max-md:fixed max-md:bottom-0 max-md:left-0 max-md:top-14"
         [style.width]="sidebarWidth"
         [class.max-md:translate-x-0]="sidebar.openMobile()"
         [class.max-md:-translate-x-full]="!sidebar.openMobile()">
      <app-menu-sidebar></app-menu-sidebar>
    </div>

    <!-- Loading indicator is confined to this content column and never
         captures the pointer: header and sidebar stay usable while a page
         loads. See shared/content-loader.component.ts. -->
    <div class="relative flex min-w-0 flex-1 flex-col">
      <main #contentScope class="flex min-h-0 min-w-0 flex-1 flex-col overflow-y-auto">
        <div data-crumbs class="border-b border-[var(--border)] bg-[var(--card)] px-4 py-2">
          <app-breadcrumbs></app-breadcrumbs>
        </div>
        <router-outlet></router-outlet>
      </main>
      <app-content-loader [scope]="contentScope"></app-content-loader>
    </div>
  </div>
</div>
