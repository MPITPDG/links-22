<div class="im-page">
  <div class="ph">
    <div>
      <h1>{{Header| uppercase}}</h1>
      <p>Agent (vessel) master request</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>Agent Details</h2></div>
    <div class="fields">
      <div class="fld">
        <label>Short Name <span class="req">*</span></label>
        <input [(ngModel)]="ShrtName" type="text" class="form-control">
      </div>
      <div class="fld">
        <label>PAN No.</label>
        <input [(ngModel)]="panno" type="text" class="form-control" maxlength="20">
      </div>
      <div class="fld full">
        <label>Name <span class="req">*</span></label>
        <div class="inl" style="display:flex; gap:8px;">
          <select class="form-control" style="max-width:110px" [(ngModel)]="title">
            <option value="Mr.">Mr.</option>
            <option value="Ms">Ms</option>
            <option value="Mrs.">Mrs.</option>
            <option value="Miss">Miss</option>
            <option value="Dr.">Dr.</option>
            <option value="Messrs">Messrs</option>
          </select>
          <input [(ngModel)]="Name" type="text" class="form-control">
        </div>
      </div>
      <div class="fld full">
        <label>Address 1</label>
        <input [(ngModel)]="addrs21" type="text" class="form-control" maxlength="40">
      </div>
      <div class="fld">
        <label>Address 2</label>
        <input [(ngModel)]="addrs22" type="text" class="form-control" maxlength="40">
      </div>
      <div class="fld">
        <label>Address 3</label>
        <input [(ngModel)]="addrs23" type="text" class="form-control" maxlength="40">
      </div>
      <div class="fld">
        <label>Pincode</label>
        <input [(ngModel)]="Pincode2" type="text" class="form-control">
      </div>
      <div class="fld">
        <label>Pincode Position</label>
        <span><input type="radio" [checked]="position2=='After'" (change)="position2='After'"> After
          <input type="radio" [checked]="position2=='Before'" (change)="position2='Before'"> Before</span>
      </div>
      <div class="fld">
        <label>City <span class="req">*</span></label>
        <select class="form-control" [(ngModel)]="city2" (change)="Countryfilter($event.target.value)">
          <option value="">Please select</option>
          @for (d of Citylist; track d) {
            <option value={{d.DATAVALUEFIELD}}>{{d.DATATEXTFIELD}}</option>
          }
        </select>
      </div>
      <div class="fld">
        <label>Country</label>
        <input disabled [(ngModel)]="country2" type="text" class="form-control">
      </div>
      <div class="fld">
        <label>Telephone No.</label>
        <input [(ngModel)]="teleno" type="text" class="form-control">
      </div>
      <div class="fld">
        <label>Fax No</label>
        <input [(ngModel)]="nofax" type="text" class="form-control">
      </div>
      <div class="fld">
        <label>SHPG Line 1</label>
        <select class="form-control" [(ngModel)]="SHPGLine1">
          <option value="SELF">--Self--</option>
          @for (d of this.Shipgline ; track d) {
            <option value={{d.liner_code}}>{{d.liner_name}}</option>
          }
        </select>
      </div>
      <div class="fld">
        <label>SHPG Line 2</label>
        <select class="form-control" [(ngModel)]="SHPGLine2">
          <option value="">Please select</option>
          @for (d of this.Shipgline; track d) {
            <option value={{d.liner_code}}>{{d.liner_name}}</option>
          }
        </select>
      </div>
      <div class="fld">
        <label>SHPG Line 3</label>
        <select class="form-control" [(ngModel)]="SHPGLine3">
          <option value="">Please select</option>
          @for (d of this.Shipgline; track d) {
            <option value={{d.liner_code}}>{{d.liner_name}}</option>
          }
        </select>
      </div>
      <div class="fld">
        <label>SHPG Line 4</label>
        <select class="form-control" [(ngModel)]="SHPGLine4">
          <option value="">Please select</option>
          @for (d of this.Shipgline; track d) {
            <option value={{d.liner_code}}>{{d.liner_name}}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>Contact 1 Details</h2></div>
    <div class="fields">
      <div class="fld full">
        <label>Name</label>
        <div class="inl" style="display:flex; gap:8px;">
          <select class="form-control" style="max-width:90px" [(ngModel)]="Ctitle1">
            <option value="Mr.">Mr.</option>
            <option value="Ms">Ms.</option>
            <option value="Mrs.">Mrs.</option>
            <option value="Miss">Miss.</option>
            <option value="Dr.">Dr.</option>
          </select>
          <input [(ngModel)]="Cname1" type="text" class="form-control">
        </div>
      </div>
      <div class="fld">
        <label>Designation</label>
        <input [(ngModel)]="CDesignation1" type="text" class="form-control">
      </div>
      <div class="fld">
        <label>Telephone No. (Direct)</label>
        <input [(ngModel)]="Ctelphone1" type="text" class="form-control">
      </div>
      <div class="fld">
        <label>FAX (Direct)</label>
        <input [(ngModel)]="Cfaxno1" type="text" class="form-control">
      </div>
      <div class="fld">
        <label>Mobile No.</label>
        <input [(ngModel)]="Cmobileno1" type="text" class="form-control">
      </div>
      <div class="fld">
        <label>E-Mail</label>
        <input [(ngModel)]="Cemail1" type="text" class="form-control" (change)="onChange(Cemail1)">
      </div>
    </div>
  </div>

    <span class="note">Nothing is saved until you choose {{text}}.</span>
    <div class="r">
      <button class="btn g" type="reset" (click)="RestMain();">Reset</button>
      <button class="btn p" type="submit" (click)="Add_Main()">{{text}}</button>
    </div>
