<div class="im-page">
  <div class="ph">
    <div>
      <h1>{{Header| uppercase}}</h1>
      <p>City master</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>City Details</h2></div>
    <div class="fields">
      <div class="fld">
        <label>City Code (3 digit IATA code) <span class="req">*</span></label>
        <input [(ngModel)]="txtcity_code" type="text" class="form-control">
      </div>
      <div class="fld">
        <label>City Name <span class="req">*</span></label>
        <input [(ngModel)]="txtcity_name" type="text" class="form-control">
      </div>
      <div class="fld">
        <label>Country <span class="req">*</span></label>
        <select class="form-control" [(ngModel)]="drpcity_country">
          <option value="">Please select</option>
          @for (d of Countrylist; track d) {
            <option value={{d.country_name}}>{{d.country_name}}</option>
          }
        </select>
      </div>
      <div class="fld full">
        <label>Documentation</label>
        <div class="inl" style="display:flex; flex-wrap:wrap; gap:14px;">
          @for (data of Transpoints; track data) {
            <label style="font-weight:normal;"><input type="checkbox" (change)="onChange(data.Transpoint, $event.target.checked)"> {{data.Transpoint}}</label>
          }
        </div>
      </div>
    </div>
  </div>

  <div class="bar">
    <span class="note">Nothing is saved until you choose Submit.</span>
    <div class="r">
      <button class="btn g" type="reset">Reset</button>
      <button class="btn p" type="button" (click)="finalSubmit()">Submit</button>
    </div>
  </div>
</div>
