<!--
  Accounts -> Reports -> Trial balance -> Group wise.
  Download-only: ExportToExcel() fetches the data and builds the workbook client-side.
-->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>Trial balance &middot; group wise</h1>
      <p>Balances rolled up by account group as on a date &middot; downloads an Excel file</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>{{ Header | titlecase }}</h2><span class="meta"><b>*</b> required</span></div>
    <div class="fields">
      <div class="fld">
        <label>As on <span class="req">*</span></label>
        <my-date-picker name="AsonDate" (dateChanged)="AsOnDateChanged($event)" [options]="myDatePickerOptionsInv" [selDate]="AsonDate"></my-date-picker>
      </div>
      <div class="fld"></div>
    </div>
    <div class="fk-note">The workbook downloads directly; nothing is displayed on this screen.</div>
  </div>

  <div class="bar">
    <span class="note">Balances as on the selected date.</span>
    <div class="r">
      <button class="btn p" type="submit" (click)="ExportToExcel()">Export to Excel</button>
    </div>
  </div>
</div>
