<!--
  Accounts -> Reports -> Item statement (download).
  Download-only: ExportToExcel() -> Accounts/Acc_Rpt_ItemStatement queues the file, then routes to
  /accounts/report/ReportDownload/:pkid. download() is an empty legacy stub, kept.
-->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>{{ PageName }}</h1>
      <p>Every movement on one item account for a period &middot; generated as an Excel file</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>Item and period</h2><span class="meta"><b>*</b> required</span></div>
    <div class="fields">
      <div class="fld full">
        <label>Item <span class="req">*</span></label>
        <ng-select [items]="ItemList" bindLabel="ITEMACTNAME" bindValue="ITEMCODE" [(ngModel)]="Item" (ngModelChange)="GetItemName($event)"
          class="custom" placeholder="--Please Select--"></ng-select>
      </div>
      <div class="fld full">
        <label>Quick period</label>
        <div class="fk-seg">
          @for (p of periods; track p.key) {
            <button type="button" [class.on]="period === p.key" (click)="setPeriod(p.key)">{{ p.label }}</button>
          }
        </div>
      </div>
      <div class="fld">
        <label>From date <span class="req">*</span></label>
        <my-date-picker name="FromDate" (dateChanged)="FromDateChanged($event); period = ''" [options]="myDatePickerOptionsInv" [selDate]="FromDate"></my-date-picker>
      </div>
      <div class="fld">
        <label>To <span class="req">*</span></label>
        <my-date-picker name="ToDate" (dateChanged)="ToDateChanged($event); period = ''" [options]="myDatePickerOptionsInv" [selDate]="ToDate"></my-date-picker>
      </div>
    </div>
    <div class="fk-note">The statement is generated on the server and opens on the Report download page.</div>
  </div>

  <div class="bar">
    <span class="note">From date defaults to 01/04/2006 (all history).</span>
    <div class="r">
      <button class="btn g" type="submit" (click)="download()">Download</button>
      <button class="btn p" type="submit" (click)="ExportToExcel()">Export to Excel</button>
    </div>
  </div>
</div>
