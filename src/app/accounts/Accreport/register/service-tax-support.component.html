<!--
  Accounts -> Reports -> Register -> Service tax register support.
  Download-only: ExportToExcel() -> Accounts/ServiceTaxRegSupport queues the file, then routes to
  /accounts/report/ReportDownload/:pkid. clear() is an empty legacy stub and is kept.
-->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>Service tax register support</h1>
      <p>Supporting detail for the service tax register &middot; downloads an Excel file</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>Period and branch</h2><span class="meta"><b>*</b> required</span></div>
    <div class="fields">
      <div class="fld full">
        <label>Quick period</label>
        <div class="fk-seg">
          @for (p of periods; track p.key) {
            <button type="button" [class.on]="period === p.key" (click)="setPeriod(p.key)">{{ p.label }}</button>
          }
        </div>
      </div>
      <div class="fld">
        <label>From <span class="req">*</span></label>
        <my-date-picker name="FromDate" [options]="myDatePickerOptions" [(ngModel)]="FromDate" (dateChanged)="period = ''"></my-date-picker>
      </div>
      <div class="fld">
        <label>To <span class="req">*</span></label>
        <my-date-picker name="ToDate" [options]="myDatePickerOptions" [(ngModel)]="ToDate" (dateChanged)="period = ''"></my-date-picker>
      </div>
      <div class="fld full">
        <label>Branch</label>
        <div class="fk-opts">
          <label><input type="radio" name="rdbcityAll" value="ALL" [(ngModel)]="Branch" /> All</label>
          <label><input type="radio" name="rdbcityAll" value="" [(ngModel)]="Branch" /> {{ City }}</label>
        </div>
      </div>
    </div>
  </div>

  <div class="bar">
    <span class="note">Opens the Report download page when the file is queued.</span>
    <div class="r">
      <button class="btn g" type="reset" (click)="clear(); period = ''">Clear</button>
      <button class="btn p" type="submit" (click)="ExportToExcel()">Export to Excel</button>
    </div>
  </div>
</div>
