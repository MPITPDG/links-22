<!--
  Cash expenses statement - search.
  Monochrome page kit (import-page.css + ../vouchers-page.css). Employee, date range, job-details
  radio, search() and ResetAll() are unchanged. Note: search() posts to Accounts/CE_STAEMENT and
  only logs the response (legacy); there is no result list to show yet.
-->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>{{ Header }} statement</h1>
      <p>Cash expenses of one employee over a date range</p>
    </div>
  </div>

  <div class="card sec">
    <div class="fields">
      <div class="fld full">
        <label>Employee name</label>
        <select [(ngModel)]="Employee">
          <option value="">Please select</option>
          @for (d of Employyetable; track d) {
            <option value={{d.acctcode}}>{{d.acctname}}</option>
          }
        </select>
      </div>
      <div class="fld">
        <label>From</label>
        <my-date-picker name="user_startdate" [options]="myDatePickerOptions" [(ngModel)]="user_startdate"></my-date-picker>
      </div>
      <div class="fld">
        <label>To</label>
        <my-date-picker name="user_enddate" [options]="myDatePickerOptions" [(ngModel)]="user_enddate"></my-date-picker>
      </div>
      <div class="fld full">
        <label>Job details</label>
        <div class="v-radios">
          <label><input type="radio" name="radioDisplay" value="0" [(ngModel)]="Display" /> With</label>
          <label><input type="radio" name="radioDisplay" value="1" [(ngModel)]="Display" /> Without</label>
        </div>
      </div>
    </div>
  </div>

  <div class="bar">
    <span class="note">Choose an employee and a date range.</span>
    <div class="r">
      <button class="btn g" type="reset" (click)="ResetAll();">Reset</button>
      <button type="button" name="submitButton" class="btn p" (click)="search();">Search</button>
    </div>
  </div>
</div>
