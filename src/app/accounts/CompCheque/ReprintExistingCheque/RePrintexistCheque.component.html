<!--
  Reprint existing cheque.
  Recipe 4 (print): only this on-screen chrome is restyled. PrintData() opens the legacy
  frm_Acc_CompCheq_PrintCheque_RePrint_Existing.aspx?ChequeNo=... in a popup window; that URL
  and the printed cheque are unchanged.
-->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>Reprint existing cheque</h1>
      <p>Print an already-issued cheque again from its number</p>
    </div>
  </div>

  <div class="card sec">
    <div class="fields">
      <div class="fld full">
        <label>Cheque no.</label>
        <div class="v-pair">
          <input type="text" [(ngModel)]="ChequeNo" (keyup.enter)="PrintData()">
          <button class="btn p" type="submit" (click)="PrintData()">Print</button>
        </div>
      </div>
    </div>
    <div class="v-actions">
      <span class="v-note">The cheque opens in the legacy print window.</span>
    </div>
  </div>
</div>
