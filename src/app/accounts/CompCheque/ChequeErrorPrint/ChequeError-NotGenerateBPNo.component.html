<!--
  Cheque error print - reprint a cheque whose request was assigned but no BP number was generated.
  Recipe 4 (print): only this on-screen chrome is restyled. PrintData() calls
  Acc__ChequePrintError_Report and opens the legacy
  frm_Acc_CompCheq_RePrintCheque_AssignReqNo_NotGenerate_BPNo_Print.aspx in a popup window;
  that URL and the printed cheque are unchanged.
-->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>Cheque error print</h1>
      <p>Reprint an existing cheque whose request was assigned but never printed</p>
    </div>
  </div>

  <div class="card sec">
    <div class="fields">
      <div class="fld full">
        <label>Cheque no.</label>
        <div class="v-pair">
          <input type="text" [(ngModel)]="ChequeNo" (keyup.enter)="PrintData()">
          <button class="btn p" type="submit" (click)="PrintData()">Search &amp; print</button>
        </div>
      </div>
    </div>
    <div class="v-actions">
      <span class="v-note">The cheque opens in the legacy print window.</span>
    </div>
  </div>
</div>
