<!--
  Cheque stock - add a cheque book range.
  Monochrome page kit (import-page.css + ../cheque-page.css). Our bank, from / to cheque no.,
  entry date, addchequestock() and resetchequestock() are unchanged.
-->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>Cheque stock</h1>
      <p>Register a new range of cheque leaves against one of our banks</p>
    </div>
    <div class="tools">
      <button class="btn g" type="button" routerLink="/accounts/CompCheque/Cheque/search">Cheque stock list</button>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h">
      <h2>Cheque range</h2>
      <span class="meta"><b>*</b> required</span>
    </div>
    <div class="fields">
      <div class="fld full">
        <label>Our bank <span class="req">*</span></label>
        <select [(ngModel)]="OurBank">
          <option value="">Please select</option>
          @for (d of OurBankList; track d) {
            <option value={{d.ACCTCODENAME}}>{{d.ACCTNAME}}</option>
          }
        </select>
      </div>
      <div class="fld">
        <label>From cheque no. <span class="req">*</span></label>
        <input [(ngModel)]="from_chqno" type="text" maxlength="40">
      </div>
      <div class="fld">
        <label>To cheque no. <span class="req">*</span></label>
        <input [(ngModel)]="to_chqno" type="text" maxlength="40">
      </div>
      <div class="fld full">
        <label>Cheque entry date <span class="req">*</span></label>
        <my-date-picker name="cheque_create_date" [options]="myDatePickerOptions" [(ngModel)]="cheque_create_date"></my-date-picker>
      </div>
    </div>
  </div>

  <div class="bar">
    <span class="note">Nothing is saved until you choose Add.</span>
    <div class="r">
      <button class="btn g" type="reset" (click)="resetchequestock();">Reset</button>
      <button class="btn p" type="submit" (click)="addchequestock()">Add</button>
    </div>
  </div>
</div>
