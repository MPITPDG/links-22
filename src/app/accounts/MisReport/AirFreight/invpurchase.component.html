<!--
  Accounts -> MIS -> Air freight statement / freight payable (route Mode FRTP).
  Download-only: ExportData() -> ACC_MIS_AIRFREIGHT_STATEMENT or ACC_RPT_AIRFRT_INVO_SERACH_LIST,
  workbook built client-side (ExportexcelService).
-->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>{{ Header | titlecase }}</h1>
      <p>{{ subheader | titlecase }} for a period &middot; downloads an Excel workbook</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>Period</h2><span class="meta"><b>*</b> required</span></div>
    <div class="fields">
      <div class="fld full">
        <label>Quick period</label>
        <div class="fk-seg">
          @for (p of periods; track p.key) {
            <button type="button" [class.on]="period === p.key" (click)="setPeriod(p.key)">{{ p.label }}</button>
          }
        </div>
      </div>
      <div class="fld">
        <label>From date <span class="req">*</span></label>
        <my-date-picker name="FromDate" (dateChanged)="FromDateChanged($event); period = ''" [options]="myDatePickerOptionsRpt" [selDate]="FromDate"></my-date-picker>
      </div>
      <div class="fld">
        <label>To date <span class="req">*</span></label>
        <my-date-picker name="ToDate" (dateChanged)="ToDateChanged($event); period = ''" [options]="myDatePickerOptionsRpt" [selDate]="ToDate"></my-date-picker>
      </div>
    </div>
    <div class="fk-note">The statement downloads as an Excel file; nothing is listed on this screen.</div>
  </div>

  <div class="bar">
    <span class="note">The output is an Excel file; nothing is listed on this screen.</span>
    <div class="r">
      <button class="btn p" type="submit" (click)="ExportData()">Export to Excel</button>
    </div>
  </div>
</div>
