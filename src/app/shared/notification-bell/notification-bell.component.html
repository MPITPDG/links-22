<!--
  Header notification bell (ported from MPERPNG-20). Sits to the left of the
  branch/city button in both the full and header-footer layouts; the chromeless
  popup shell has no header and therefore no bell.
-->
<div class="nb-root">

  <button type="button" uiBtn variant="ghost" size="sm"
          class="nb-trigger border border-white/20 !text-white hover:!bg-white/10 hover:border-white/30"
          [attr.aria-label]="triggerLabel()"
          [attr.aria-expanded]="open"
          aria-haspopup="dialog"
          [title]="triggerLabel()"
          (click)="toggle($event)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="h-4 w-4">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>
    @if (badgeCount() > 0) {
      <span class="nb-badge" aria-hidden="true">{{ badgeCount() > 9 ? '9+' : badgeCount() }}</span>
    }
  </button>

  @if (open) {
    <div class="nb-panel" role="dialog" aria-modal="false" aria-label="Notifications">

      <div class="nb-head">
        <span class="nb-title">Notifications</span>
        <span class="nb-count">{{ unreadCount() }} unread</span>
        <span class="nb-spacer"></span>
        <button type="button" class="nb-act" (click)="markAllRead()"
                [disabled]="unreadCount() === 0">Mark all read</button>
        <button type="button" class="nb-act" (click)="clearAll()"
                [disabled]="items().length === 0">Clear all</button>
      </div>

      <!--
        PLUG-IN POINT: MP renders two more sections here, above the messages -
        "Job alerts" (JobStateService, export job-state alerts) and "Tickets"
        (TicketService, ticket events) - followed by a "Messages" sub-heading
        when either is present. Links' API has no JobState / Tickets endpoints
        yet; port those blocks from MPERPNG-20's notification-bell.component.html
        (and the matching .nb-sub/.nb-alert CSS) once it does.
      -->

      <div class="nb-list">
        @for (n of items(); track n.id) {
          <div class="nb-item" [class.nb-unread]="!n.read">
            <span class="nb-mark">{{ mark(n.type) }}</span>
            <div class="nb-body">
              <div class="nb-item-title">{{ n.title }}</div>
              @if (n.body) { <div class="nb-item-text">{{ n.body }}</div> }
              <div class="nb-when">{{ when(n.at) }}</div>
            </div>
            <button type="button" class="nb-x"
                    [attr.aria-label]="'Dismiss notification: ' + (n.title || 'notification')"
                    (click)="dismiss(n.id)">&times;</button>
          </div>
        } @empty {
          <div class="nb-empty">No notifications yet</div>
        }
      </div>

    </div>
  }

</div>
