<!--
  Financial year picker.

  Previously relied on ngx-bootstrap's dropdownToggle / *dropdownMenu, which
  need an enclosing [dropdown] container. Dropped into the new header it had no
  such container, so the trigger rendered but the menu never opened - which is
  why the accounts header appeared to have no year picker at all.

  Self-contained now: open state on the component, a click-away catcher, and
  the same markup shape as the rest of the shell.
-->
<div class="relative">

  @if (!financialYearList.length) {
    <span class="text-xs font-medium text-[var(--sidebar-muted)]">Choose Financial Year First</span>
  } @else {

    <button type="button" (click)="toggle($event)"
            [attr.aria-expanded]="open"
            uiBtn variant="ghost" size="sm"
            class="border border-[var(--sidebar-border)] !text-[var(--sidebar-foreground)] hover:!bg-[var(--sidebar-accent)]">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="h-3.5 w-3.5">
        <rect x="3" y="4" width="18" height="18" rx="2" />
        <path d="M16 2v4M8 2v4M3 10h18" />
      </svg>
      <span class="whitespace-nowrap font-medium tabular-nums">{{ shortLabel }}</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
           class="h-3 w-3 opacity-60 transition-transform" [class.rotate-180]="open">
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </button>

    @if (open) {
      <div class="fixed inset-0 z-40" (click)="close()" aria-hidden="true"></div>

      <!--
        w-max, not a fixed width: the panel hugs its content so there is no
        dead space to the right of the dates. min-w-full keeps it at least as
        wide as the trigger.
      -->
      <div class="no-scrollbar absolute right-0 z-50 mt-1 max-h-[60vh] w-max min-w-full
                  overflow-y-auto rounded-lg border border-[var(--sidebar-border)]
                  bg-[var(--sidebar)] p-1 shadow-lg"
           role="menu">
        <div class="px-2 pb-1 pt-1.5 text-[10px] font-semibold uppercase tracking-[0.08em]
                    text-[var(--sidebar-muted)]">
          Account year
        </div>
        @for (obj of financialYearList; track obj.PK_YEARID) {
          <button type="button" role="menuitem" (click)="pick(obj)"
                  [class]="itemCls(obj)">
            <!--
              The tick occupies a reserved slot on every row, visible only on
              the active one. Rendering it conditionally shifted the dates by
              its width, so rows did not line up.
            -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                 class="h-3.5 w-3.5 shrink-0" [class.invisible]="!isSelected(obj)">
              <polyline points="20 6 9 17 4 12" />
            </svg>
            <span>{{ obj.STARTDATE }} To {{ obj.ENDDATE }}</span>
          </button>
        }
      </div>
    }
  }
</div>
