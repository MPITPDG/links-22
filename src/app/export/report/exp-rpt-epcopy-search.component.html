<!--
  Export -> Report -> EP-Copy Excel.
  Recipe 2 (form page): onexcelGeneration() downloads a server-generated
  .xls, no on-screen result rows. Every ngModel / click handler kept.
-->
<div class="im-page xr-page">
  <div class="ph">
    <div>
      <h1>EP-Copy</h1>
      <p>Export the EP copy register to Excel.</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>Report Type</h2></div>
    <div class="fields">
      <div class="fld full">
        <label>Mode</label>
        <div class="xr-radios">
          <label class="xr-radio">
            <input type="radio" name="radiogroup" (click)="mainCheck('1')" [checked]="checkWise == '1'" />
            Sea
          </label>
          <label class="xr-radio">
            <input type="radio" name="radiogroup" (click)="mainCheck('2')" [checked]="checkWise == '2'" />
            Air
          </label>
        </div>
      </div>

      <div class="fld">
        <label for="selRptType">Type</label>
        <select id="selRptType" [(ngModel)]="rpttype">
          <option value="-1">Please select</option>
          <option value="NOT_RECEIVED">Not Received</option>
          <option value="RECEIVED_BUT_NOT_SENT_TO_THE_CLIENT">Received But Not Sent to the Client</option>
          <option value="RECEIVED_AND_SENT_TO_THE_CLIENT">Received and Sent to the Client</option>
        </select>
      </div>

      <div class="fld">
        <label for="selCity">City</label>
        <select id="selCity" [(ngModel)]="city">
          <option value="-1">Please select</option>
          @for (d of listCity; track d) {
            <option value={{d.citycode}}>{{d.cityname}}</option>
          }
        </select>
      </div>

      <div class="fld">
        <label for="selExporter">Exporter</label>
        <select id="selExporter" [(ngModel)]="exporter">
          <option value="-1">Please select</option>
          @for (d of listExporter; track d) {
            <option value={{d.exp_code}}>{{d.exp_name}}</option>
          }
        </select>
      </div>

      <div class="fld">
        <label>From Date</label>
        <my-date-picker name="dtfrm" [options]="myDatePickerOptions" [(ngModel)]="dtfrmt" required></my-date-picker>
      </div>

      <div class="fld">
        <label>To Date</label>
        <my-date-picker name="dtpto" [options]="myDatePickerOptions" [(ngModel)]="dtto" required></my-date-picker>
      </div>
    </div>
  </div>

  <div class="bar">
    <span class="note">Downloads an .xls file.</span>
    <div class="r">
      <button class="btn p" type="Print" (click)="onexcelGeneration()">Export to Excel</button>
    </div>
  </div>
</div>
