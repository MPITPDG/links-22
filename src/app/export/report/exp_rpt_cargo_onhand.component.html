<!--
  Export -> Report -> Cargo On Hand.
  Recipe 2 (form page): onexcelGeneration() downloads a server-generated
  .xls, no on-screen result rows. Every ngModel / click handler kept.
-->
<div class="im-page xr-page">
  <div class="ph">
    <div>
      <h1>Cargo On Hand</h1>
      <p>Filter cargo on hand by mode of shipment and consignee.</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>Filters</h2></div>
    <div class="fields">
      <div class="fld">
        <label>Mode of Shipment</label>
        <div class="xr-radios">
          <label class="xr-radio">
            <input type="radio" name="radiogroup1" value="1" [(ngModel)]="checkmode" /> Sea
          </label>
          <label class="xr-radio">
            <input type="radio" name="radiogroup1" value="2" [(ngModel)]="checkmode" /> Air
          </label>
        </div>
      </div>

      <div class="fld">
        <label for="selConcode">Consignee</label>
        <select id="selConcode" [(ngModel)]="concode" [disabled]="condisable">
          <option value="-1">Please select</option>
          @for (d of listconcode; track d) {
            <option value={{d.CON_CODE}}>{{d.CON_NAME}}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <div class="bar">
    <span class="note">Downloads an .xls file.</span>
    <div class="r">
      <button class="btn p" type="button" (click)="onexcelGeneration()">Export To Excel</button>
    </div>
  </div>
</div>
