<!--
  Export -> Report -> Tonnage.
  Recipe 2 (form page): onexcelGeneration() downloads a server-generated
  .xls (mode/date/subject drive the query), no on-screen result rows --
  the API returns a file, not rows, so no client-side chart is possible
  without changing the payload contract. Every ngModel / click handler kept.
-->
<div class="im-page xr-page">
  <div class="ph">
    <div>
      <h1>Tonnage</h1>
      <p>Filter shipments by mode, date range and origin/destination.</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>Filters</h2></div>
    <div class="fields">
      <div class="fld">
        <label>Mode</label>
        <div class="xr-radios">
          <label class="xr-radio">
            <input type="radio" name="radiogroupM" (click)="ModeCheck('1')" [checked]="checkmode == '1'" /> Sea
          </label>
          <label class="xr-radio">
            <input type="radio" name="radiogroupM" (click)="ModeCheck('2')" [checked]="checkmode == '2'" /> Air
          </label>
        </div>
      </div>

      <div class="fld full">
        <label class="xr-radio">
          <input type="radio" name="radiogroupD" (click)="mainchkDate('1')" [checked]="checkdate == '1'" /> Datewise
        </label>
      </div>

      <div class="fld">
        <label>From Date</label>
        <my-date-picker name="dtfrm" [options]="myDatePickerOptions" [(ngModel)]="dtfrmt" required [disabled]=fddisable></my-date-picker>
      </div>

      <div class="fld">
        <label>To Date</label>
        <my-date-picker name="dtpto" [options]="myDatePickerOptions" [(ngModel)]="dtto" required [disabled]=fddisable></my-date-picker>
      </div>

      <div class="fld full">
        <label class="xr-radio">
          <input type="radio" name="radiogroupD" (click)="mainchkDate('2')" [checked]="checkdate == '2'" /> Weekly
        </label>
      </div>

      <div class="fld">
        <label>Date</label>
        <my-date-picker name="dtfrm" [options]="myDatePickerOptions" [(ngModel)]="dtwkfrmt" required [disabled]=wkdisable></my-date-picker>
      </div>

      <div class="fld">
        <label>Origin</label>
        <ng-select class="custom"
          #select
          [items]="listorigin"
          [multiple]="true"
          bindLabel="city_code"
          bindValue="city_code"
          [(ngModel)]="origin">
        </ng-select>
      </div>

      <div class="fld">
        <label class="xr-radio">
          <input type="radio" name="radiogroupS" (click)="mainSub('1')" [checked]="checkSub == '1'" /> Consignee
        </label>
        <select [(ngModel)]="concode" [disabled]=condisable>
          <option value="-1">Please select</option>
          @for (d of listconcode; track d) {
            <option value={{d.con_code}}>{{d.con_name}}</option>
          }
        </select>
      </div>

      <div class="fld">
        <label class="xr-radio">
          <input type="radio" [disabled]=aldisableR name="radiogroupS" (click)="mainSub('2')" [checked]="checkSub == '2'" /> Airline
        </label>
        <select [(ngModel)]="aline" [disabled]=aldisable>
          <option value="-1">Please select</option>
          @for (d of listAline; track d) {
            <option value={{d.AWB_PRIFIX}}>{{d.AIRLINE_NAME}}</option>
          }
        </select>
      </div>

      <div class="fld">
        <label class="xr-radio">
          <input type="radio" name="radiogroupS" (click)="mainSub('3')" [checked]="checkSub == '3'" /> Agent
        </label>
        <select [(ngModel)]="SAgent" [disabled]=agtdisable>
          <option value="-1">Please select</option>
          @for (d of listAgent; track d) {
            <option value={{d.SUP_CODE}}>{{d.SUP_NAME}}</option>
          }
        </select>
      </div>

      <div class="fld">
        <label>Destination</label>
        <ng-select class="custom"
          #select
          [items]="listdetport"
          [multiple]="true"
          bindLabel="city_name"
          bindValue="city_code"
          [(ngModel)]="dest">
        </ng-select>
      </div>
    </div>
  </div>

  <div class="bar">
    <span class="note">Downloads an .xls file.</span>
    <div class="r">
      <button class="btn p" type="Print" (click)="onexcelGeneration()">Export to Excel</button>
    </div>
  </div>
</div>
