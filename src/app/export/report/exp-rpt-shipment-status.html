<!--
  Export -> Report -> Shipment Status.
  Recipe 2 (form page): onexcelGeneration() downloads a server-generated
  .xls, no on-screen result rows. Every ngModel / click handler kept.
-->
<div class="im-page xr-page">
  <div class="ph">
    <div>
      <h1>Shipment Status Report</h1>
      <p>Filter shipments by consignee, agent, associate, origin, date and mode.</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>Filters</h2></div>
    <div class="fields">
      <div class="fld">
        <label class="xr-radio">
          <input type="radio" name="radiogroup" (click)="mainCheck('1')" [checked]="checkWise == '1'" /> Consignee Name
        </label>
        <ng-select [items]="listconcode" bindLabel="con_name" [disabled]=condisable
          bindValue="con_code" [(ngModel)]="concode"
          class="custom" placeholder="Please Select">
        </ng-select>
      </div>

      <div class="fld">
        <label class="xr-radio">
          <input type="radio" name="radiogroup" (click)="mainCheck('2')" [checked]="checkWise == '2'" /> Sourcing Agent
        </label>
        <select [(ngModel)]="SAgent" [disabled]=agtdisable>
          <option value="-1">Please select</option>
          @for (d of listSAgent; track d) {
            <option value={{d.exp_code}}>{{d.exp_name}}</option>
          }
        </select>
      </div>

      <div class="fld">
        <label class="xr-radio">
          <input type="radio" name="radiogroup" (click)="mainCheck('3')" [checked]="checkWise == '3'" /> Business Associate
        </label>
        <select [(ngModel)]="Busass" [disabled]=Badisable>
          <option value="-1">Please select</option>
          @for (d of listBusAss; track d) {
            <option value={{d.SUP_CODE}}>{{d.SUP_NAME}}</option>
          }
        </select>
      </div>

      <div class="fld">
        <label for="selCity">Shipment From (Origin)</label>
        <select id="selCity" [(ngModel)]="city">
          <option value="0">All</option>
          <option value="MUM">Mumbai</option>
          <option value="DEL">Delhi</option>
          <option value="AMD">Ahmedabad</option>
          <option value="CAL">Calcutta</option>
          <option value="MAA">Chennai</option>
          <option value="BLR">Bangalore</option>
          <option value="TRU">Tirupur</option>
          <option value="COC">Cochin</option>
          <option value="TRN">Tuticorin</option>
        </select>
      </div>

      <div class="fld">
        <label>Shipment status from date</label>
        <my-date-picker name="dtfrm" [options]="myDatePickerOptions" [(ngModel)]="dtfrmt" required></my-date-picker>
      </div>

      <div class="fld">
        <label>Mode of Shipment</label>
        <div class="xr-radios">
          <label class="xr-radio">
            <input type="radio" name="radiogroup1" (click)="ModeCheck('1')" [checked]="checkmode == '1'" /> Sea
          </label>
          <label class="xr-radio">
            <input type="radio" name="radiogroup1" (click)="ModeCheck('2')" [checked]="checkmode == '2'" /> Air
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="bar">
    <span class="note">Downloads an .xls file.</span>
    <div class="r">
      <button class="btn p" type="Print" (click)="onexcelGeneration()">Export to Excel</button>
    </div>
  </div>
</div>
