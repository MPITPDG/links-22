<!--
  Export -> Report -> DSR.
  Recipe 2 (form page): onexcelGeneration() downloads a server-generated
  .xls, no on-screen result rows. Every ngModel / click handler kept.
-->
<div class="im-page xr-page">
  <div class="ph">
    <div>
      <h1>DSR Report</h1>
      <p>Export the daily status register to Excel.</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>Report Type</h2></div>
    <div class="fields">
      <div class="fld">
        <label class="xr-radio">
          <input type="radio" name="radiogroup" (click)="mainCheck('1')" [checked]="checkWise == '1'" />
          Consignee Name
        </label>
        <ng-select [items]="listconcode" bindLabel="CON_NAME" [disabled]="condisable"
          bindValue="CON_CODE" [(ngModel)]="concode"
          class="custom" placeholder="Please Select">
        </ng-select>
      </div>

      <div class="fld">
        <label class="xr-radio">
          <input type="radio" name="radiogroup" (click)="mainCheck('2')" [checked]="checkWise == '2'" />
          Sourcing Agent
        </label>
        <select [(ngModel)]="SAgent" [disabled]="agtdisable">
          <option value="-1">Please select</option>
          @for (d of listSAgent; track d) {
            <option value={{d.EXP_CODE}}>{{d.EXP_NAME}}</option>
          }
        </select>
      </div>

      <div class="fld">
        <label class="xr-radio">
          <input type="radio" name="radiogroup" (click)="mainCheck('3')" [checked]="checkWise == '3'" />
          Shipper
        </label>
        <select [(ngModel)]="Shipper" [disabled]="shpdisable">
          <option value="-1">ALL</option>
          @for (d of listShipper; track d) {
            <option value={{d.SHIPPER_CODE}}>{{d.SHIPPER_NAME}}</option>
          }
        </select>
      </div>

      <div class="fld">
        <label for="selOrigin">Shipment From (Origin)</label>
        <select id="selOrigin" [(ngModel)]="city">
          <option value="-1">Please select</option>
          <option value="All">All</option>
          <option value="Del">Delhi</option>
          <option value="MAA">Chennai</option>
          <option value="MUM">Mumbai</option>
        </select>
      </div>

      <div class="fld">
        <label for="selMode">Mode</label>
        <select id="selMode" [(ngModel)]="Mode">
          <option value="-1">Please select</option>
          <option value="1">Air</option>
          <option value="0">Sea</option>
          <option value="2">Sea/Air</option>
        </select>
      </div>

      <div class="fld">
        <label>From Date</label>
        <my-date-picker name="dtfrm" [options]="myDatePickerOptions" [(ngModel)]="dtfrmt" required></my-date-picker>
      </div>
    </div>
  </div>

  <div class="bar">
    <span class="note">Downloads an .xls file.</span>
    <div class="r">
      <button class="btn p" type="Print" (click)="onexcelGeneration()">Export to Excel</button>
    </div>
  </div>
</div>
