<!--
  Export -> Report -> Shipment Progress (search-criteria form; Search
  downloads an Excel workbook from Export/Generate_Shipment_Progress -- there
  is no browsable on-screen result grid, so this page is the filter card
  only, on the Import page kit).
-->
<div class="im-page erp-page">
  <div class="ph">
    <div>
      <h1>Shipment Progress</h1>
      <p>Search shipment progress by mode, city, date range and milestone.</p>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><h2>Search criteria</h2></div>

    <div class="filters erp-filters">
      <div class="f full">
        <label>Mode</label>
        <div class="erp-opts">
          <label class="erp-opt" [class.on]="ReportType === 'Sea'">
            <input type="radio" value="Sea" name="rbReportType" [(ngModel)]="ReportType" />
            Sea
          </label>
          <label class="erp-opt" [class.on]="ReportType === 'Air'">
            <input type="radio" value="Air" name="rbReportType" [(ngModel)]="ReportType" />
            Air
          </label>
        </div>
      </div>

      <div class="f">
        <label for="spCity">City</label>
        <ng-select id="spCity" [items]="CityList" bindLabel="cityname" bindValue="citycode1" placeholder="--Select City--" [(ngModel)]="City"
            class="custom">
        </ng-select>
      </div>

      <div class="f full">
        <label>Date range</label>
        <div class="erp-presets">
          <button type="button" (click)="setPreset(0)">This month</button>
          <button type="button" (click)="setPreset(3)">Last 3 months</button>
          <button type="button" (click)="setPreset(12)">Last 12 months</button>
        </div>
      </div>

      <div class="f">
        <label>From Date</label>
        <my-date-picker name="abcd" [options]="myDatePickerOptions" [(ngModel)]="FromDate"></my-date-picker>
      </div>

      <div class="f">
        <label>To Date</label>
        <my-date-picker name="abcd" [options]="myDatePickerOptions" [(ngModel)]="ToDate"></my-date-picker>
      </div>

      <div class="f full">
        <label>Entered Date</label>
        <div class="erp-opts">
          <label class="erp-opt" [class.on]="DateType === 'actual'">
            <input type="radio" value="actual" name="rbDateType" [(ngModel)]="DateType" />
            Actual
          </label>
          <label class="erp-opt" [class.on]="DateType === 'system'">
            <input type="radio" value="system" name="rbDateType" [(ngModel)]="DateType" />
            System
          </label>
        </div>
      </div>

      <div class="f full">
        <label>Display Type</label>
        <div class="erp-opts">
          @for (o of displayTypeOptions; track o.value) {
            <label class="erp-opt" [class.on]="DisplayType === o.value">
              <input type="radio" [value]="o.value" name="rbDisplayType" [(ngModel)]="DisplayType" />
              {{ o.label }}
            </label>
          }
        </div>
      </div>
    </div>

    <div class="toolbar erp-actions">
      <span class="sub-t">Search downloads an Excel workbook of the shipment progress.</span>
      <span class="tb-r">
        <button class="btn p" type="button" (click)="onSearch()">Search</button>
      </span>
    </div>
  </div>
</div>
