<div class="im-page">

  <div class="ph">
    <div>
      <h1>Air Cargo Status</h1>
      <p>Choose a consignee or sourcing agent, then export.</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h">
      <h2>Report criteria</h2>
    </div>

    <div class="fields">

      <div class="fld">
        <label class="radio">
          <input type="radio" value="Consignee" name="rbType" [(ngModel)]="Type" />
          Consignee Name
        </label>
        <ng-select [items]="ConsigneeList" bindLabel="CON_NAME" bindValue="CON_CODE" placeholder="--Select--"
                   [(ngModel)]="Consignee" [disabled]="Type=='Sourcing'">
        </ng-select>
      </div>

      <div class="fld">
        <label class="radio">
          <input type="radio" value="Sourcing" name="rbType" [(ngModel)]="Type" />
          Sourcing Agent
        </label>
        <ng-select [items]="SourcingAgentList" bindLabel="EXP_NAME" bindValue="EXP_CODE" placeholder="--Select--"
                   [(ngModel)]="SourcingAgent" [disabled]="Type=='Consignee'">
        </ng-select>
      </div>

      <div class="fld">
        <label>Shipment From (Origin)</label>
        <ng-select [items]="CityList" bindLabel="cityname" bindValue="citycode" placeholder="--Select--"
                   [(ngModel)]="Shipment">
        </ng-select>
      </div>

    </div>

    <div class="toolbar">
      <span class="note" style="padding:0;">Report is generated as an Excel file and downloaded directly — there is no on-screen preview.</span>
      <div class="tb-r">
        <button type="button" class="btn p" (click)="onSearch()">Export to Excel</button>
      </div>
    </div>
  </div>

</div>
