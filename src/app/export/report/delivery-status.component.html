<!--
  Export -> Report -> Delivery Status (search-criteria form; Search downloads
  an Excel workbook from Export/Generate_Delivery_Status -- there is no
  browsable on-screen result grid, so this page is the filter card only, on
  the Import page kit).
-->
<div class="im-page erp-page">
  <div class="ph">
    <div>
      <h1>Delivery Status</h1>
      <p>Search delivery status by mode, city, consignee and date range.</p>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><h2>Search criteria</h2></div>

    <div class="filters erp-filters">
      <div class="f full">
        <label>Mode</label>
        <div class="erp-opts stack">
          <label class="erp-opt" [class.on]="ReportType === '0.CONSIGNEE LINER CONTRACT'">
            <input type="radio" value="0.CONSIGNEE LINER CONTRACT" name="rbReportType" [(ngModel)]="ReportType" />
            CONSIGNEE LINER CONTRACT
          </label>
          <label class="erp-opt" [class.on]="ReportType === '1.OUR LINER CONTRACT'">
            <input type="radio" value="1.OUR LINER CONTRACT" name="rbReportType" [(ngModel)]="ReportType" />
            OUR LINER CONTRACT
          </label>
          <label class="erp-opt" [class.on]="ReportType === '2.BOTH (All Contract)'">
            <input type="radio" value="2.BOTH (All Contract)" name="rbReportType" [(ngModel)]="ReportType" />
            BOTH (All Contract)
          </label>
        </div>
      </div>

      <div class="f">
        <label for="dsCity">City</label>
        <ng-select id="dsCity" class="custom" [items]="CityList" bindLabel="cityname" bindValue="citycode"
                   placeholder="--Select City--" [(ngModel)]="City">
        </ng-select>
      </div>

      <div class="f">
        <label for="dsConsignee">Consignee</label>
        <ng-select id="dsConsignee" class="custom" [items]="ConsigneeList" bindLabel="con_name" bindValue="con_code"
                   placeholder="--Show All--" [(ngModel)]="Consignee">
        </ng-select>
      </div>

      <div class="f full">
        <label>Date range</label>
        <div class="erp-presets">
          <button type="button" (click)="setPreset(0)">This month</button>
          <button type="button" (click)="setPreset(3)">Last 3 months</button>
          <button type="button" (click)="setPreset(12)">Last 12 months</button>
        </div>
      </div>

      <div class="f">
        <label>From Date</label>
        <my-date-picker name="abcd" [options]="myDatePickerOptions" [(ngModel)]="FromDate"></my-date-picker>
      </div>

      <div class="f">
        <label>To Date</label>
        <my-date-picker name="abcd" [options]="myDatePickerOptions" [(ngModel)]="ToDate"></my-date-picker>
      </div>
    </div>

    <div class="toolbar erp-actions">
      <span class="sub-t">Search downloads an Excel workbook of the delivery status.</span>
      <span class="tb-r">
        <button class="btn p" type="button" (click)="onSearch()">Search</button>
      </span>
    </div>
  </div>
</div>
