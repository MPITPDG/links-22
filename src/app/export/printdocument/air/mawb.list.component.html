<!--
  Export - print document - MAWB job list. Page kit recipe 1, ported from MPERPNG-20.
  The host shell (mawb.component.html, Links' stock-driven MAWB generate / search) is
  left as it is, so this child carries its own .im-page root.
-->
<div class="im-page">
  <div class="card">
    <div class="card-h"><h2>Export jobs for this MAWB</h2></div>
    @if (searchList.length > 0) {
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th>Select</th>
              <th>EXPT NO</th>
              <th>Shipper</th>
              <th>Consignee</th>
              <th class="num">Pkgs</th>
              <th class="num">Grwt</th>
              <th class="num">Chrg.Wt</th>
              <th class="num">Pcs</th>
              <th>Shipment Mode</th>
            </tr>
          </thead>
          <tbody>
            @for (obj of searchList; track obj) {
              <tr>
                <td class="text-center">
                  <input type="checkbox" (checked)="obj.SELECT == true" [disabled]="obj.Disabled == true" (click)="validate(obj.MODEOFSHIP,obj.EXPTNO)" />
                </td>
                <td class="mono">{{obj.EXPTNO}}</td>
                <td>{{obj.SHIPPER}}</td>
                <td>{{obj.CONSIGNEE}}</td>
                <td class="num">{{obj.PKGS}}</td>
                <td class="num">{{obj.GRWT}}</td>
                <td class="num">{{obj.CHBLWT}}</td>
                <td class="num">{{obj.PCS}}</td>
                <td>{{obj.MODEOFSHIP}}</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
    <div class="bar" style="margin:0;">
      <span class="note"></span>
      <span class="r">
        <button type="button" class="btn p" name="submit" (click)="submit();">Submit</button>
      </span>
    </div>
  </div>
</div>
