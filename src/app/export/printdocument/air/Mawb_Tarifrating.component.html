<!--
  MAWB tariff-rating popup (MAWBModelpopupcomponent). Chrome restyled from MPERPNG-20:
  plain title bar, the rating sheet (styled by mawb-tarif-rating.css on the child), and
  Abort / Update pinned bottom right (.modal-footer is right-aligned). Bindings unchanged.
-->
<div bsModal #MAWBModelpopup="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="mySmallModalLabel" aria-hidden="true" [config]="{backdrop: 'static'}">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header px-4 py-3">
        <span class="modal-title text-sm font-semibold">{{title}}</span>
      </div>
      <div class="modal-body modal-fix-body px-4 py-3">
        <app-MAWB_tariffRate [exptno]="exptno" [type]="'MawbTarif'" [hidden]="(type == 'MawbTarif')? false : true" (result)="onSuccess($event)" (disabledBtn)="onDisabled($event)" #MawbRate></app-MAWB_tariffRate>
      </div>
      <div class="modal-footer px-4 py-3" style="gap:8px;">
        <button type="button" uiBtn variant="outline" (click)="hide()">Abort</button>
        @if (type != 'VIEW') {
          <button type="button" uiBtn variant="default" (click)="updateData()" name="updateButton" #updateButton><app-font-changer [fontIndex]="'4'"></app-font-changer> Update</button>
        }
      </div>
    </div>
  </div>
</div>
