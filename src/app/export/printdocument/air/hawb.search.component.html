<!--
  Hosted inside hawb.component.html's .im-page card. Ported from MPERPNG-20; MP's extra
  "Print Hawb" button (popup /popup/hawbprint) is not carried: that popup does not exist in Links.
  The Print button still opens the same legacy ASPX URL as before (printData() unchanged).
-->
<div class="card-h"><h2>Export - Master HAWB No</h2></div>

<div class="fields" style="padding:14px 16px;">

  <div class="fld">
    <label>HAWB No. <span class="req">*</span></label>
    <div>
      <input type="text" [(ngModel)]="hawbno" [OnlyNumber]="true" [maxlength]="15"
             (keyup.enter)="searchData()" />
      @if (error == 1) {
        <p class="hint" style="color:var(--faint);">Invalid Hawb Number*</p>
      }
    </div>
  </div>

  <div class="fld">
    <label>HAWB Date. <span class="req">*</span></label>
    <div>
      <my-date-picker name="hawbdate" [options]="myDatePickerOptions" [(ngModel)]="hawbdate"></my-date-picker>
      @if (error == 2) {
        <p class="hint" style="color:var(--faint);">Hawb date can not blank*</p>
      }
    </div>
  </div>

</div>

<div class="bar" style="margin:0;">
  <span class="note"></span>
  <span class="r">
    <button type="button" class="btn g" name="searchButton" (click)="searchData();">Search</button>
    <button type="button" class="btn p" name="printButton" (click)="printData();">Print</button>
  </span>
</div>
