<!--
  Export - print document - MAWB search / print, step 1 (app-mawb-search, hosted by
  mawb.component.html). Page kit card built to the approved mock links-export-mocks.html #m3;
  the page heading lives in the host. Carries its own .im-page root (see the host).
  Bindings, validations and messages are the old screen's: Search calls searchData(),
  Print calls printData().
-->
<div class="im-page">
  <div class="card sec">
    <div class="card-h">
      <h2>1 · MAWB</h2>
      <div class="acts">
        <button type="button" name="printButton" class="btn g sm" (click)="printData();">Print</button>
        <button type="button" name="searchButton" class="btn sm" (click)="searchData();">Search</button>
      </div>
    </div>
    <div class="fields">
      <div class="fld">
        <label for="mawb-s-airline">Airline <span class="req">*</span></label>
        <select id="mawb-s-airline" [(ngModel)]="AirLine">
          <option value="0">Please select</option>
          @for (d of AirLineList; track d) {
            <option value={{d.DATAVALUEFIELD}}>{{d.DATATEXTFIELD}}</option>
          }
        </select>
        @if (error == 1) {
          <span class="hint err">Please select AirLine*</span>
        }
      </div>
      <div class="fld cut">
        <label for="mawb-s-no">MAWB no. <span class="req">*</span></label>
        <input id="mawb-s-no" type="text" class="mono" [(ngModel)]="mawbno" [OnlyNumber]="true" [maxlength]="11" />
        @if (error == 2) {
          <span class="hint err">Please enter Mawb Number*</span>
        }
        @if (error == 3) {
          <span class="hint err">Invalid Mawb Number*</span>
        }
      </div>
      <div class="fld full">
        <label>MAWB date <span class="req">*</span></label>
        <my-date-picker class="dp-s" name="mawbdate" [options]="myDatePickerOptions" [(ngModel)]="mawbdate"></my-date-picker>
        @if (error == 4) {
          <span class="hint err">Mawb date can not blank*</span>
        }
      </div>
    </div>
  </div>
</div>
