<div class="animated fadeIn">
	@if (viewType == 'Search') {
<app-print-air-hawb-search (searchoutput)="getSearchInputValue($event)"></app-print-air-hawb-search>
}
	@if (viewType == 'List') {
<app-print-air-hawb-list [searchList]="searchList" [searchLength]="searchLength" (result)="getDataFromList($event)"></app-print-air-hawb-list>
}
	@if (viewType == 'Update') {
<app-print-air-hawb-update [searchList]="searchList" [hawbno]="hawbno"  [hawbdate]="strHawbDate" [exptnos]="exptnos" (result)="getPrintData($event)"></app-print-air-hawb-update>
}
</div>
