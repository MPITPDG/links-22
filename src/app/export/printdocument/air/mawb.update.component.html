<!--
  Export - print document - MAWB update. Page kit recipe 2, ported from MPERPNG-20.
  Used by PrintDocumentMawbUpdateComponents (mawb.component.ts) and PrintDocumentMawbUpdateComponent
  (PrintDocumentMawbUpdateComponent.ts). The host shell is Links' stock-driven MAWB screen and is
  left as it is, so this child carries its own .im-page root. Bindings unchanged.
-->
<div class="im-page">
  <div class="card">
    <div class="card-h"><h2>MAWB No. details</h2></div>

    <div class="fields" style="padding:14px 16px;">

      <div class="fld">
        <label>MAWB No. <span class="req">*</span></label>
        <span>{{mawbno}}</span>
      </div>

      <div class="fld">
        <label>MAWB Date. <span class="req">*</span></label>
        <span>{{mawbdate}}</span>
      </div>

      <div class="fld">
        <label>Freight Type <span class="req">*</span></label>
        <select [(ngModel)]="FreightType">
          <option value="-1">select</option>
          <option value="CC">CC</option>
          <option value="PP">PP</option>
        </select>
      </div>

      <div class="fld">
        <label>Freight Currency <span class="req">*</span></label>
        <select [(ngModel)]="Fcurrency">
          <option value="-1">Please select</option>
          @for (d of currencyList; track d) {
            <option value={{d.CUR_CODE}}>{{d.CUR_NAME}}</option>
          }
        </select>
      </div>

      <div class="fld">
        <label>Freight Amount <span class="req">*</span></label>
        <input type="text" [(ngModel)]="FreightAmount" [OnlyNumber]="true" [maxlength]="11" />
      </div>

      <div class="fld">
        <label>Shipment Type <span class="req">*</span></label>
        <select [(ngModel)]="ShipType" (change)="ddx_Onchange(ShipType)">
          <option value="-1"> select</option>
          <option value="0">Normal</option>
          <option value="1">DDX</option>
        </select>
      </div>

      <div class="fld">
        <label>Dest.Warehouse <span class="req">*</span></label>
        <select [(ngModel)]="ShipDest" [disabled]="ShipType == '0' || ShipType == null">
          <option value="0">Please select</option>
          @for (d of destinationList; track d) {
            <option value={{d.PK_ID}}>{{d.DDX_DESTINATION}}</option>
          }
        </select>
      </div>

    </div>

    <div class="tbl-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th>EXPT NO</th>
            <th>Shipper</th>
            <th>Consignee</th>
            <th class="num">Pkgs</th>
            <th class="num">Grwt</th>
            <th class="num">Chrg.Wt</th>
            <th class="num">Pcs</th>
          </tr>
        </thead>
        <tbody>
          @for (obj of mawbnoList; track obj) {
            <tr>
              <td class="mono">{{obj.EXPTNO}}</td>
              <td>{{obj.SHIPPER}}</td>
              <td>{{obj.CONSIGNEE}}</td>
              <td class="num">{{obj.PKGS}}</td>
              <td class="num">{{obj.GRWT}}</td>
              <td class="num">{{obj.CHBLWT}}</td>
              <td class="num">{{obj.PCS}}</td>
            </tr>
          }
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td class="num"><input type="text" style="height:26px;" [(ngModel)]="totalGrwt" [OnlyNumber]="true" /></td>
            <td class="num"><input type="text" style="height:26px;" [(ngModel)]="totalChblwt" [OnlyNumber]="true" /></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="bar" style="margin:0;">
      <span class="note"></span>
      <span class="r">
        <button type="button" class="btn g" name="cancelButton" (click)="cancel();">Cancel</button>
        <button type="button" class="btn p" name="submit" (click)="submit();">Submit</button>
      </span>
    </div>
  </div>
</div>
