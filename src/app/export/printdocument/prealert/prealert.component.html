<div>
  @if (viewType == 'Prepare') {
    <app-export-prealert-prepare [searchList]="searchList" [searchListLength]="searchListLength" (result)="PrealertPrepare($event)"></app-export-prealert-prepare>
  }
  @if (viewType == 'Auto') {
    <app-export-prealert-auto [searchList]="searchList" [searchListLength]="searchListLength" (result)="AutoPrealert($event)"></app-export-prealert-auto>
  }
  @if (viewType == 'Sending') {
    <app-export-prealert-sending-through (result)="ExitPrealert($event)" ></app-export-prealert-sending-through>
  }
</div>
