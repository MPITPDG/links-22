<div class="im-page">
  <div class="ph">
    <div>
      <h1>Prepare Pre-Alert</h1>
      <p>Enter the MAWB No. and remark, then preview the pre-alert document</p>
    </div>
  </div>

  <div class="card">
    <div class="filters" style="grid-template-columns: 1fr 1fr auto;">
      <div class="f">
        <label for="txtPrepMawbNo">MAWB No.</label>
        <input type="text" id="txtPrepMawbNo" name="txtPrepMawbNo" [(ngModel)]="MAWBNO" [maxlength]="15" placeholder="MAWB No." />
      </div>
      <div class="f">
        <label for="txtPrepRemark">Remark</label>
        <input type="text" id="txtPrepRemark" name="txtPrepRemark" [(ngModel)]="REMARK" [maxlength]="50" placeholder="Remark" />
      </div>
      <div class="f">
        <button class="btn p" type="button" (click)="previewClick()">Preview</button>
      </div>
    </div>

    <div class="toolbar">
      <span>
        <span class="count">Ready to generate</span>
        @if (MAWBNO) {
          <span class="sub-t"> — document PREALERT_{{ MAWBNO }}.doc</span>
        } @else {
          <span class="sub-t"> — enter a MAWB No. to continue</span>
        }
      </span>
      @if (MAWBNO) {
        <span class="tb-r">
          <span class="chip dash">MAWB {{ MAWBNO }}</span>
          <span class="chip dash">{{ REMARK || 'No remark' }}</span>
        </span>
      }
    </div>
  </div>
</div>
