<div class="im-page">
  <div class="ph">
    <div>
      <h1>Annexure</h1>
      <p>Export No <b>{{exptno}}</b> — edit particulars or print the annexure</p>
    </div>
    <div class="tools">
      <button class="btn g" type="button" name="searchButton" (click)="backButton();">
        Back to search
      </button>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h">
      <h2>Edit</h2>
      <span class="meta">Choose a section to edit</span>
    </div>
    <div class="an-tabs" role="tablist">
      @for (obj of EditMenuList; track obj) {
        @if (obj.type === 'EDIT') {
          <button type="button" role="tab" (click)="redirectTo(obj.id, obj.type)">
            {{obj.name}}
          </button>
        }
      }
    </div>
  </div>

  <div class="card">
    <div class="card-h">
      <h2>Print</h2>
      <span class="meta">Opens in a new tab</span>
    </div>
    <div class="an-print-list">
      @for (obj of EditMenuList; track obj) {
        @if (obj.type === 'PRINT') {
          <div class="row">
            <span>{{obj.name}}</span>
            <button class="btn g" type="button" (click)="redirectTo(obj.id, obj.type)">Print</button>
          </div>
        }
      }
    </div>
  </div>

</div>
