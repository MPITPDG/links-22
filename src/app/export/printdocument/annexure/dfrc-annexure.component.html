<div class="im-page">
  <div class="ph">
    <div>
      <h1>31. DFRC licenses particulars</h1>
    </div>
    <div class="tools">
      <button class="btn g" type="button" name="searchButton" (click)="backToEdit();">
        Back to Edit/Print menu
      </button>
    </div>
  </div>

  <div class="card">
    <div class="tbl-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th>Invoice Serial Number</th>
            <th>Item Serial Number</th>
            <th>Registration Number</th>
            <th>Standard IO Group Code</th>
            <th>Standard IO Serial Number</th>
            <th>Standard IO Norm Serial Number</th>
            <th>Qty</th>
            <th>Accouting Unit</th>
            <th>Whether Indigenous/Imported</th>
          </tr>
        </thead>
        <tbody>
          @for (obj of dtDfrc; track obj; let i = $index) {
            <tr>
              <td>
                <input type="text" [(ngModel)]="obj.SRNO">
              </td>
              <td>
                <input type="text" [(ngModel)]="obj.ITEMNO">
              </td>
              <td>
                <input type="text" [(ngModel)]="obj.REGNO">
              </td>
              <td>
                <input type="text" [(ngModel)]="obj.SRNOE">
              </td>
              <td>
                <input type="text" [(ngModel)]="obj.SRNOC">
              </td>
              <td>
                <input type="text" [(ngModel)]="obj.QTY">
              </td>
              <td>
                <input type="text" [(ngModel)]="obj.UNIT">
              </td>
              <td>
                <input type="text" [(ngModel)]="obj.INDI">
              </td>
              <td>
                <input type="text" [(ngModel)]="obj.SRNON">
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="toolbar">
      <span></span>
      <span class="tb-r">
        <button class="btn g" type="button" (click)="addRow()">Add more row</button>
        <button class="btn p" type="button" (click)="saveDrawbackDetails()">Save item details</button>
      </span>
    </div>
  </div>

</div>
