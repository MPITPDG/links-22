<div class="im-page">
  <div class="ph">
    <div>
      <h1>Annexure</h1>
      <p>Look up an export job to edit or print its Annexure particulars</p>
    </div>
  </div>

  <div class="card">
    <div class="card-h">
      <h2>Search details</h2>
    </div>
    <div class="fields">
      <div class="fld">
        <label for="annexure-exptno">Export No <span class="req">*</span></label>
        <input id="annexure-exptno" type="text" name="annexure-exptno"
               [(ngModel)]="ExptNo" [OnlyNumber]="true" [maxlength]="15"
               (keyup.enter)="searchData()" />
      </div>
    </div>
    <div class="toolbar">
      <span></span>
      <span class="tb-r">
        <button class="btn p" type="button" name="searchButton"
                (click)="searchData();" #searchButton>
          Search
        </button>
      </span>
    </div>
  </div>

</div>
