<div class="im-page">
  <div class="ph">
    <div>
      <h1>29. Drawback particulars</h1>
    </div>
    <div class="tools">
      <button class="btn g" type="button" name="searchButton" (click)="backToEdit();">
        Back to Edit/Print menu
      </button>
    </div>
  </div>

  <div class="card">
    <div class="tbl-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th>Invoice Serial Number</th>
            <th>Item Serial Number</th>
            <th>DBK Serial Number</th>
            <th>Quantity</th>
            <th>Raw Material Serial Number</th>
            <th>Raw Material Quantity</th>
          </tr>
        </thead>
        <tbody>
          @for (obj of dtDrawback; track obj; let i = $index) {
            <tr>
              <td>
                <input type="text" [(ngModel)]="obj.INVSRNO">
              </td>
              <td>
                <input type="text" [(ngModel)]="obj.ITEMSRNO">
              </td>
              <td>
                <input type="text" [(ngModel)]="obj.DBKSRNO">
              </td>
              <td>
                <input type="text" [(ngModel)]="obj.QTY">
              </td>
              <td>
                <input type="text" [(ngModel)]="obj.RMSRNO">
              </td>
              <td>
                <input type="text" [(ngModel)]="obj.RSQTY">
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="toolbar">
      <span></span>
      <span class="tb-r">
        <button class="btn g" type="button" (click)="addRow()">Add more row</button>
        <button class="btn p" type="button" (click)="saveDrawbackDetails()">Save item details</button>
      </span>
    </div>
  </div>

</div>
