<!--
  Export - docket search. Page kit recipe 1 (.im-page, global kit src/styles/kit/import-page.css),
  ported from MPERPNG-20. There is no list API behind this page, so it is the filter card only.
  searchData() is unchanged: it validates ExptNo by the city rule and opens the docket print
  (./#/new-tab/docket-print/<ExptNo>) in a new tab, exactly as before.
-->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>Docket search</h1>
      <p>Print the export docket for a given export number</p>
    </div>
  </div>

  <div class="card sec">
    <div class="filters">
      <div class="f">
        <label for="docket-exptno">Export No</label>
        <input id="docket-exptno" type="text" name="docket-exptno"
               [(ngModel)]="ExptNo" [OnlyNumber]="true" [maxlength]="15"
               placeholder="Export number" (keyup.enter)="searchData()" />
      </div>
      <div class="f">
        <button class="btn p" type="button" name="searchButton" (click)="searchData();" #searchButton>Search</button>
      </div>
    </div>
  </div>

</div>
