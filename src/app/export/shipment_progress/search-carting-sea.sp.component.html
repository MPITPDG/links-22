<!-- Shipment progress - carting (sea) search. Kit filter card; bindings unchanged. -->
<div class="card">
  <div class="card-h">
    <h2>Vessel</h2>
    <span class="meta">{{ vslnameList.length }} vessels open for carting</span>
  </div>
  <div class="filters f2">
    <div class="f">
      <label for="spCsVessel">Vessel name</label>
      <select id="spCsVessel" [(ngModel)]="VslName" (change)="onAgentSelect($event.target.value)">
        <option value="">Please select</option>
        @for (d of vslnameList; track d) {
          <option value={{d.RTNOPRT}}>
            {{d.VSL_NAME}}
          </option>
        }
      </select>
    </div>
    <div class="f">
      <label for="spCsAgent">Vessel agent</label>
      <select id="spCsAgent" [(ngModel)]="VslAgent">
        <option value="">Please select</option>
        @for (d of Agentlist; track d) {
          <option value={{d.agt_code}}>{{d.agt_name}}</option>
        }
      </select>
    </div>
    <div class="f">
      <label>&nbsp;</label>
      <button class="btn p" type="submit" name="btnAgtAdd" (click)="onsearch()" #searchButton [disabled]="loading">
        @if (loading) { Searching&hellip; } @else { Search }
      </button>
    </div>
  </div>
</div>
