<!-- Shipment progress - manage carting (sea). Not routed; kit markup, bindings unchanged. -->
<div class="card">
  <div class="filters f2">
    <div class="f">
      <label>Vessel name</label>
      <select [(ngModel)]="VslName" (change)="onAgentSelect($event.target.value)">
        <option value="">Please select</option>
        @for (d of vslnameList; track d) {
          <option value={{d.VSL_RTNO}}>{{d.VSL_NAME}}</option>
        }
      </select>
    </div>
    <div class="f">
      <label>Vessel agent</label>
      <select [(ngModel)]="VslAgent">
        <option value="">Please select</option>
        @for (d of Agentlist; track d) {
          <option value={{d.agt_code}}>{{d.agt_name}}</option>
        }
      </select>
    </div>
    <div class="f"></div>
  </div>
  <div class="sp-foot">
    <div class="r">
      <button class="btn g" type="submit" id="btndelete" name="btnSearch" (click)="deletecarting()">Delete</button>
      <button class="btn g" type="reset" (click)="trfVessel()">Tranfer Veseel</button>
      <button class="btn p" type="submit" name="btnAgtAdd" (click)="onsearch()">Submit</button>
    </div>
  </div>
</div>
