<!-- Shipment progress - transfer sea to air. Import page kit, compact form; bindings unchanged. -->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>Transfer sea to air</h1>
      <p>Move this sea export to an air export under the chosen company</p>
    </div>
    <div class="tools">
      <span class="chip">{{ExptNo}}</span>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h"><h2>Company</h2><span class="meta"><b>*</b> required</span></div>
    <div class="fields">
      <div class="fld full">
        <label>Company name <span class="req">*</span></label>
        <ng-select [items]="CompanyList"
          bindLabel="CMP_NAME"
          bindValue="CMP_CODE"
          placeholder="-- Select --"
          [(ngModel)]="Company"
          class="custom"
          >
        </ng-select>
      </div>
    </div>
  </div>

  @if (ErrorMessage != '') {
    <div class="sp-note">{{ErrorMessage}}</div>
  }

  <div class="bar">
    <span class="note">The air export number is shown once the transfer completes.</span>
    <div class="r">
      <button type="button" name="abortButton" class="btn g" (click)="abort();"><app-font-changer [fontIndex]="'7'"></app-font-changer> Cancel</button>
      <button type="button" name="submitButton" class="btn p" (click)="submit();" [disabled]="ErrorMessage != ''" #submitButton><app-font-changer [fontIndex]="'14'"></app-font-changer> Transfer</button>
    </div>
  </div>
</div>
