<!-- Shipment progress - BL details update. Import page kit, compact form; bindings unchanged. -->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>BL details</h1>
      <p>Update the bill of lading details for this export job</p>
    </div>
    <div class="tools">
      <span class="chip">{{ExptNo}}</span>
    </div>
  </div>

  <app-shipment-progress-common-view [ExptNo]="ExptNo"></app-shipment-progress-common-view>

  <div class="card sec">
    <div class="card-h"><h2>Bill of lading</h2><span class="meta">dates as dd/mm/yyyy</span></div>
    <div class="fields">
      <div class="fld full">
        <label>B/L type</label>
        <div class="sp-radios">
          <label><input type="radio" name="BLType" [checked]="BlType == 'M'" (change)="BlType='M'" />Master B/L</label>
          <label><input type="radio" name="BLType" [checked]="BlType == 'S'" (change)="BlType='S'" />Seaway B/L</label>
        </div>
      </div>
      <div class="fld">
        <label>B/L no.</label>
        <input type="text" [(ngModel)]="BLNo" />
      </div>
      <div class="fld">
        <label>B/L date</label>
        <my-date-picker name="mydatepicker" [options]="myDatePickerOptions" [(ngModel)]="BLDate"></my-date-picker>
      </div>
      <div class="fld">
        <label>B/L freight</label>
        <select [(ngModel)]="BLFreight">
          <option value="-1">Please select</option>
          <option value="CC">CC</option>
          <option value="PP">PP</option>
        </select>
      </div>
      <div class="fld">
        <label>HBL no.</label>
        <input type="text" [(ngModel)]="HBLNo" />
      </div>
      <div class="fld full">
        <label>HBL date</label>
        <my-date-picker name="mydatepicker" [options]="myDatePickerOptions" [(ngModel)]="HBLDate"></my-date-picker>
      </div>
    </div>
  </div>

  @if (ErrorMessage != '') {
    <div class="sp-note">{{ErrorMessage}}</div>
  }

  <div class="bar">
    <span class="note">Nothing is saved until you choose Update.</span>
    <div class="r">
      <button type="button" name="abortButton" class="btn g" (click)="abort();"><app-font-changer [fontIndex]="'7'"></app-font-changer> Cancel</button>
      <button type="button" name="submitButton" class="btn p" (click)="submit();" [disabled]="ErrorMessage != ''" #submitButton><app-font-changer [fontIndex]="'14'"></app-font-changer> Update</button>
    </div>
  </div>
</div>
