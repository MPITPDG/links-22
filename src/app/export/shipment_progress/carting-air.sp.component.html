<!-- Shipment progress - carting (air) update. Import page kit, compact form; bindings unchanged. -->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>Carting (air)</h1>
      <p>Record the carting date for this shipment</p>
    </div>
    <div class="tools">
      <span class="chip">{{ExptNo}}</span>
    </div>
  </div>

  <app-shipment-progress-common-view [ExptNo]="ExptNo"></app-shipment-progress-common-view>

  <div class="card sec">
    <div class="card-h"><h2>Carting</h2><span class="meta">dd/mm/yyyy</span></div>
    <div class="fields">
      <div class="fld full">
        <label>Carted date</label>
        <my-date-picker name="mydatepicker" [options]="myDatePickerOptions" [(ngModel)]="CartingDate"></my-date-picker>
      </div>
    </div>
  </div>

  @if (ErrorMessage != '') {
    <div class="sp-note">{{ErrorMessage}}</div>
  }

  <div class="bar">
    <span class="note">Nothing is saved until you choose Update.</span>
    <div class="r">
      <button type="button" name="abortButton" class="btn g" (click)="abort();"><app-font-changer [fontIndex]="'7'"></app-font-changer> Cancel</button>
      <button type="button" name="submitButton" class="btn p" (click)="submit();" [disabled]="ErrorMessage != ''" #submitButton><app-font-changer [fontIndex]="'14'"></app-font-changer> Update</button>
    </div>
  </div>
</div>
