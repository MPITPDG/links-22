<!-- Shipment progress - approval received update. Import page kit, compact form; bindings unchanged. -->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>Approval received</h1>
      <p>Record when and by whom the approval was received</p>
    </div>
    <div class="tools">
      <span class="chip">{{ExptNo}}</span>
    </div>
  </div>

  <app-shipment-progress-common-view [ExptNo]="ExptNo"></app-shipment-progress-common-view>

  <div class="card sec">
    <div class="card-h"><h2>Approval</h2><span class="meta">dates as dd/mm/yyyy</span></div>
    <div class="fields">
      <div class="fld">
        <label>Approval date</label>
        <my-date-picker name="mydatepicker" [options]="myDatePickerOptions" [(ngModel)]="ApprovalDate"></my-date-picker>
      </div>
      <div class="fld">
        <label>By whom</label>
        <input type="text" [(ngModel)]="ByWhom" [maxlength]="20" />
      </div>
      <div class="fld full top">
        <label>Remark</label>
        <textarea rows="2" [(ngModel)]="Remark"></textarea>
      </div>
    </div>
  </div>

  @if (ErrorMessage != '') {
    <div class="sp-note">{{ErrorMessage}}</div>
  }

  <div class="bar">
    <span class="note">Nothing is saved until you choose Update.</span>
    <div class="r">
      <button type="button" name="abortButton" class="btn g" (click)="abort();"><app-font-changer [fontIndex]="'7'"></app-font-changer> Cancel</button>
      <button type="button" name="submitButton" class="btn p" (click)="submit();" [disabled]="ErrorMessage != ''" #submitButton><app-font-changer [fontIndex]="'14'"></app-font-changer> Update</button>
    </div>
  </div>
</div>
