<!--
  Export - Transfer job branch. Page kit recipe 2 (src/styles/kit/import-page.css),
  ported from MPERPNG-20. [(ngModel)] on OldJobNo / Branch / UserRemarks,
  #submitButton (handed to ButtonService) and submit() / reset() are unchanged.
-->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>Transfer job branch</h1>
      <p>Move an existing job to another branch, with a reason on the record.</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h">
      <h2>General details</h2>
      <span class="meta"><b>*</b> required</span>
    </div>
    <div class="fields">
      <div class="fld">
        <label for="bjt-oldjobno">Old job no. <span class="req">*</span></label>
        <input id="bjt-oldjobno" type="text" [(ngModel)]="OldJobNo" [maxlength]="15" />
      </div>
      <div class="fld">
        <label for="bjt-branch">Branch <span class="req">*</span></label>
        <ng-select labelForId="bjt-branch" class="custom" [items]="BranchList"
          bindLabel="TEXTFIELD" bindValue="VALUEFIELD"
          placeholder="--Select Branch--" [(ngModel)]="Branch">
        </ng-select>
      </div>
      <div class="fld full top">
        <label for="bjt-remarks">User remarks <span class="req">*</span></label>
        <textarea id="bjt-remarks" rows="3" [(ngModel)]="UserRemarks"></textarea>
      </div>
    </div>
  </div>

  <div class="bar">
    <span class="note">The job moves only after you confirm the transfer.</span>
    <div class="r">
      <button class="btn g" type="button" name="searchButton" (click)="reset();">Reset</button>
      <button class="btn p" type="button" name="searchButton" (click)="submit();" #submitButton>Submit</button>
    </div>
  </div>
</div>
