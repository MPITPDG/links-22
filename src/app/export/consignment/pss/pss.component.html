<!--
  Export PSS. Page kit recipe 2 (src/styles/kit/import-page.css), ported from
  MPERPNG-20. Look up an export no., then record its PSS. [(ngModel)], IsDisabled
  and search() / submit() / reset() are unchanged. The controls are shown and
  hidden with [hidden], not @if: search() / submit() hand #searchButton and
  #submitButton to ButtonService, and reset() can flip IsDisabled while a request
  is in flight - @if would destroy the element the ViewChild points at.
-->
<div class="im-page">
  <div class="ph">
    <div>
      <h1>PSS</h1>
      <p>Look up an export job, then record its PSS number.</p>
    </div>
  </div>

  <div class="card sec">
    <div class="card-h">
      <h2>General details</h2>
      <span class="meta"><b>*</b> required</span>
    </div>
    <div class="fields">
      <div class="fld">
        <label for="pss-exptno">Export no. <span class="req">*</span></label>
        <div class="stack">
          <input id="pss-exptno" type="text" [(ngModel)]="ExptNo" [maxlength]="15" [disabled]="IsDisabled" (keyup.enter)="search()" />
          @if (ErrorMessage) {
            <span class="hint err">{{ ErrorMessage }}</span>
          }
        </div>
      </div>
      <div class="fld" [hidden]="!IsDisabled">
        <label for="pss-value">PSS <span class="req">*</span></label>
        <input id="pss-value" type="text" [(ngModel)]="Pss" />
      </div>
    </div>
  </div>

  <div class="bar">
    <span class="note">{{ IsDisabled ? 'Nothing is saved until you choose Submit.' : 'Enter the 15-character export no. and choose Search.' }}</span>
    <div class="r">
      <button class="btn g" type="button" name="searchButton" (click)="reset();" [hidden]="!IsDisabled">Reset</button>
      <button class="btn p" type="button" name="searchButton" (click)="search();" [hidden]="IsDisabled" #searchButton>Search</button>
      <button class="btn p" type="button" name="searchButton" (click)="submit();" [hidden]="!IsDisabled" #submitButton>Submit</button>
    </div>
  </div>
</div>
