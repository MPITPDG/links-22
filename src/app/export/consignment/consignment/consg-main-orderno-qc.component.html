<!--
  Order no. quality checking (shown in the edit drawer after an Order no. update).
  Ported from MPERPNG-20: kit card with a key/value header and a .tbl grid, styled by
  the global page kit through the drawer (.im-page + kit-consignment). Every binding,
  handler and picker name is the same as the previous Links table version.
-->
<div class="card sec">
  <div class="card-h"><h2>Order no. quality checking</h2></div>
  <div class="kv2">
    <div class="kv"><span class="k">Export no.</span><span class="v mono">{{OrderNorQcList[0]?.EXPTNO}}</span></div>
    <div class="kv"><span class="k">Shipper name</span><span class="v">{{OrderNorQcList[0]?.SHIPPER}}</span></div>
    <div class="kv full"><span class="k">Consignee</span><span class="v">{{OrderNorQcList[0]?.CONSIGNEE}}</span></div>
  </div>
  <div class="tbl-wrap cs-full">
    <table class="tbl">
      <thead>
        <tr>
          <th>Order No.</th>
          <th>Reference No.</th>
          <th>Is QC Checking</th>
          <th>Type</th>
          <th>Planned Date</th>
          <th>Actual Date</th>
        </tr>
      </thead>
      <tbody>
        @for (obj of OrderNorQcList; track obj) {
          <tr>
            <td>
              <a href="javascript:void(0);" class="lnk" (click)="openWindow(obj.EXPTNO, obj.ORDERNO, obj.STYLENO, obj.CONCODE);">{{obj.ORDERNO}}</a>
            </td>
            <td>{{obj.STYLENO}}</td>
            <td>
              <select [(ngModel)]="obj.IS_QCFLAG" (ngModelChange)="obj.QC_TYPE='0'">
                <option value="0">No</option>
                <option value="1">Yes</option>
              </select>
            </td>
            <td>
              <select [(ngModel)]="obj.QC_TYPE" [disabled]="obj.IS_QCFLAG==0">
                <option value="0">Select</option>
                <option value="CQPL">CQ Plateforme</option>
                <option value="CQUSI">CQ usine</option>
              </select>
            </td>
            <td>
              <my-date-picker name="PlannedDate" [options]="myDatePickerOptions" [(ngModel)]="obj.QC_PLANNEDDT" [disabled]="obj.IS_QCFLAG==0"></my-date-picker>
            </td>
            <td>
              <my-date-picker name="ActualDate" [options]="myDatePickerOptions" [(ngModel)]="obj.QC_ACTUALDT" [disabled]="obj.IS_QCFLAG==0"></my-date-picker>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
