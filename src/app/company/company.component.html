<div class="animated fadeIn">
	<div class="row">
		<div class="col-sm-3">
		</div>
		<div class="col-sm-6 centerlabel">
			@if (loader) {
<img src="assets/img/loading.gif" />
}
			@if (errorMessage!='') {
<span>{{errorMessage}}</span>
}
			@if (companylist.length>0) {
<div class="card">
				<div class="card-body">
					<table class="table table-responsive-sm table-borderless table-hover">
						<tbody>
							@for (d of companylist; track d) {
<tr (click)="setCompany(d.CMP_CODE,d.CMP_NAME,d.IS_HBLISSUE,d.IS_HAWISSUE);">
								<td [ngStyle]="{'cursor': 'pointer'}">
									<div [ngStyle]="{'text-decoration': 'underline', 'text-align': 'left', 'color': '#0000ff', 'font-weight':'bold','font-size': '12px'}">
										<i class="fa fa-angle-double-right"></i>&nbsp;{{ d.CMP_NAME }}
									</div>
								</td>
							</tr>
}
						</tbody>
					</table>
				</div>
			</div>
}
		</div>
		<div class="col-sm-3">
		</div>
	</div>
</div>
